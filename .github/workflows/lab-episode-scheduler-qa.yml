name: Lab deterministic bounded episode scheduler QA
on:
  pull_request:
    paths:
      - '.github/workflows/lab-episode-scheduler-qa.yml'
      - 'tools/lab/**'
      - 'tests/lab/**'
      - 'src/systems/Rng.js'
      - 'src/systems/lab/**'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-episode-scheduler-qa.yml'
      - 'tools/lab/**'
      - 'tests/lab/**'
      - 'src/systems/Rng.js'
      - 'src/systems/lab/**'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Verify current game source identity
        run: |
          node tools/ruleset/build-ruleset.mjs --check
          node tools/ruleset/build-ruleset.mjs --check-identity
      - name: Deterministic schedule, bounded concurrency and cancellation
        run: npm test -- --runInBand tests/lab/episode-batch.test.js tests/lab/resource-governor.test.js
