name: RunScene authoritative restore runtime equivalence
on:
  pull_request:
    paths:
      - '.github/workflows/runscene-restore-runtime-qa.yml'
      - 'src/systems/savestate/**'
      - 'tests/determinism/runscene-runtime-kit.test.js'
      - 'tests/determinism/savestate-scene-remainder.test.js'
      - 'tests/fixtures/savestate/scene-remainder-stock-936.json'
      - 'tests/determinism/savestate-section-bindings.test.js'
      - 'tests/determinism/savestate-terrain-state.test.js'
      - 'tests/determinism/savestate-scene-subsystems.test.js'
      - 'tests/determinism/savestate-entity-state.test.js'
      - 'tests/fixtures/savestate/entity-projection-stock-936.json'
      - 'tests/determinism/savestate-matter-state.test.js'
      - 'tools/savestate-experiment/**'
      - 'src/scenes/RunScene.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runscene-restore-runtime-qa.yml'
      - 'src/systems/savestate/**'
      - 'tests/determinism/runscene-runtime-kit.test.js'
      - 'tests/determinism/savestate-scene-remainder.test.js'
      - 'tests/fixtures/savestate/scene-remainder-stock-936.json'
      - 'tests/determinism/savestate-section-bindings.test.js'
      - 'tests/determinism/savestate-terrain-state.test.js'
      - 'tests/determinism/savestate-scene-subsystems.test.js'
      - 'tests/determinism/savestate-entity-state.test.js'
      - 'tests/fixtures/savestate/entity-projection-stock-936.json'
      - 'tests/determinism/savestate-matter-state.test.js'
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Pure strict snapshot admission and existing single-use slot protections
        run: npm test -- --runInBand tests/determinism/runscene-runtime-kit.test.js tests/determinism/savestate-local-suspend-slot.test.js tests/determinism/savestate-envelope.test.js tests/determinism/savestate-native-recorder.test.js tests/determinism/savestate-primitive-state.test.js tests/determinism/savestate-matter-state.test.js tests/determinism/savestate-entity-state.test.js tests/determinism/savestate-scene-subsystems.test.js tests/determinism/savestate-terrain-state.test.js tests/determinism/savestate-section-bindings.test.js tests/determinism/savestate-scene-remainder.test.js tests/determinism/sim-math-boundary.test.js
      - name: Native source tripwire and exact build identity
        run: |
          node tools/ruleset/build-ruleset.mjs --check
          node tools/ruleset/build-ruleset.mjs --check-identity
      - name: Compile actual game for new runtime restore equivalence
        run: npm run build
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: Real full-Matter/recorder strict contact and hazard restore
        run: |
          npx vite preview --host 127.0.0.1 --port 18793 --strictPort > /tmp/restore-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18793/ >/dev/null && break; sleep 1; done
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "playwright";process.stdout.write(chromium.executablePath())')"
          GAME_URL=http://127.0.0.1:18793/ node tools/savestate-experiment/browser-experiment.mjs --strict-suffix --quick --runtime-module --json /tmp/runscene-runtime-restored-qa.json
          echo 'PASS: operational full-Matter restore matches source and replay suffix'
      - name: Fresh full-world native restore with no replay, exact terminal and all suffix fingerprints
        run: node tools/savestate-experiment/test-native-world-restore-browser.mjs
      - name: Integrated typed Matter, entities, subsystems and native terrain recipe disk transport
        run: node tools/savestate-experiment/test-native-world-restore-browser.mjs --matter-section --entity-section --scene-subsystems --terrain-section --scene-remainder
      - name: Native detached terrain recipe disk transport and streaming equivalence
        run: node tools/savestate-experiment/test-native-terrain-browser.mjs
      - name: Entire canonical candidate file, strict preflight and byte-identical recapture
        run: node tools/savestate-experiment/test-candidate-file-browser.mjs
