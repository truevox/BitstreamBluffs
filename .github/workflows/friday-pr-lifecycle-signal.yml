# Read-only event collector. An event on a feature/stacked base branch is NOT
# allowed to mutate issues or run code with issue-write permissions.
name: Friday PR lifecycle signal
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
jobs:
  signal:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Emit validated issue/PR pointer only
        id: pointer
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const kind=process.env.GITHUB_EVENT_NAME;
          if(!['pull_request','issue_comment','pull_request_review'].includes(kind))process.exit(0);
          const raw=kind==='issue_comment'
            ? (event.issue?.pull_request ? event.issue.number : null)
            : event.pull_request?.number;
          const number=Number(raw);
          if(!Number.isSafeInteger(number)||number<1||number>999999999)process.exit(0);
          fs.writeFileSync('friday-event-pointer.json',JSON.stringify({pr_number:number,event_name:kind})+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`ready=true\n`);
          NODE
      - name: Publish small untrusted pointer (NOT executable code)
        if: steps.pointer.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: friday-event-pointer
          path: friday-event-pointer.json
          retention-days: 1
          if-no-files-found: error
