name: Compiled production one-use Suspend Resume QA
on:
  pull_request:
    paths:
      - '.github/workflows/compiled-savestate-qa.yml'
      - 'package*.json'
      - 'vite.config.*'
      - 'src/scenes/**'
      - 'src/systems/savestate/**'
      - 'src/entities/**'
      - 'tools/savestate-experiment/test-player-suspend-compiled-browser.mjs'
      - 'tools/savestate-experiment/test-player-suspend-eviction-browser.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/compiled-savestate-qa.yml'
      - 'package*.json'
      - 'vite.config.*'
      - 'src/scenes/**'
      - 'src/systems/savestate/**'
      - 'src/entities/**'
      - 'tools/savestate-experiment/test-player-suspend-compiled-browser.mjs'
      - 'tools/savestate-experiment/test-player-suspend-eviction-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-savestate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact triggering head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Validate native identity
        run: |
          node tools/ruleset/build-ruleset.mjs --check
          node tools/ruleset/build-ruleset.mjs --check-identity
      - name: Compile REAL minified production game (not dev-server JS)
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Physically suspend and resume stock run against compiled Vite output
        run: |
          export CHROMIUM_EXECUTABLE="$(node --input-type=module -e 'import {chromium} from "playwright";console.log(chromium.executablePath())')"
          node tools/savestate-experiment/test-player-suspend-compiled-browser.mjs dist
          node tools/savestate-experiment/test-player-suspend-eviction-browser.mjs dist
