name: Release asset safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node tools/release/check-release.mjs --git-only
      - run: npm ci
      - run: npm run build
      - run: npm run guard:release
      - run: node --test tools/release/asset-policy.test.mjs
