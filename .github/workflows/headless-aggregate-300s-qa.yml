name: Headless native 300 simulated seconds aggregate causal parity
on:
  pull_request:
    paths:
      - '.github/workflows/headless-aggregate-300s-qa.yml'
      - 'tests/replay/renderless-aggregate-300s.test.js'
      - 'tests/replay/headlessRun.js'
      - 'src/scenes/RunScene.js'
      - 'src/entities/**'
      - 'src/data/**'
      - 'src/systems/replay/**'
      - 'src/systems/TerrainGenerator.js'
      - 'src/systems/ScoreManager.js'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/headless-aggregate-300s-qa.yml'
      - 'tests/replay/renderless-aggregate-300s.test.js'
      - 'tests/replay/headlessRun.js'
      - 'src/scenes/RunScene.js'
      - 'src/entities/**'
      - 'src/data/**'
      - 'src/systems/replay/**'
      - 'src/systems/TerrainGenerator.js'
      - 'src/systems/ScoreManager.js'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cumulative-300s-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact trigger commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Verify native ruleset and source identity
        run: |
          node tools/ruleset/build-ruleset.mjs --check
          node tools/ruleset/build-ruleset.mjs --check-identity
      - name: 36000 real native Matter ticks, both render modes, every biome mask
        run: npm test -- --runInBand tests/replay/renderless-aggregate-300s.test.js
