# The PRIVILEGED label writer is a workflow_run controlled by default branch.
# Never execute PR branch code. All artifact contents are untrusted input.
name: Friday PR lifecycle
on:
  workflow_run:
    workflows: [Friday PR lifecycle signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Reconcile an existing PR number (e.g. missed review handoff)'
        required: true
        type: number
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
jobs:
  resolve_parent:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Friday PR lifecycle signal')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      key: ${{ steps.resolve.outputs.key }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      origin_event: ${{ steps.resolve.outputs.origin_event }}
    steps:
      - name: Check out trusted default-branch routing code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify untrusted artifact size before download
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const run_id=context.payload.workflow_run.id;
            const items=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id,per_page:100});
            const matches=items.filter(x=>x.name==='friday-event-pointer'&&!x.expired);
            if(matches.length!==1||matches[0].size_in_bytes>4096)core.setFailed('Expected one small review-event pointer artifact');
      - name: Download untrusted pointer only
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: friday-event-pointer
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .friday-signal
      - name: Resolve stable parent issue for serialized label writes
        id: resolve
        uses: actions/github-script@v7
        env:
          DIRECT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const {owner,repo}=context.repo;
            let pointer;
            if(context.eventName==='workflow_dispatch'){
              pointer={pr_number:Number(process.env.DIRECT_PR_NUMBER),event_name:'workflow_dispatch'};
            }else{
              const fs=require('node:fs');
              const file='.friday-signal/friday-event-pointer.json';
              const raw=fs.readFileSync(file,'utf8');
              if(raw.length>1024)throw Error('Oversized event pointer');
              pointer=JSON.parse(raw);
            }
            if(!pointer||!Number.isSafeInteger(pointer.pr_number)||
              pointer.pr_number<1||pointer.pr_number>999999999||
              !['pull_request','issue_comment','pull_request_review','workflow_dispatch'].includes(pointer.event_name)){
              core.info('Invalid event pointer; skip');return;
            }
            const n=pointer.pr_number;
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:n})).data;
            if(pr.head?.repo?.full_name!==`${owner}/${repo}`){core.info('Fork or inaccessible PR');return;}
            const script='./.github/scripts/friday-pr-lifecycle.cjs';
            const issue=require('fs').existsSync(script)?require(script).getIssueReference(pr):null;
            core.setOutput('key',issue?`issue-${issue}`:`pr-${n}`);
            core.setOutput('pr_number',String(n));
            core.setOutput('origin_event',pointer.event_name);
  lifecycle:
    needs: resolve_parent
    if: needs.resolve_parent.outputs.key != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      # Multiple PRs to the same issue cannot race on shared labels or closure.
      group: friday-lifecycle-${{ github.repository }}-${{ needs.resolve_parent.outputs.key }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out reviewed default-branch automation code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check installed default-branch script
        id: installed
        shell: bash
        run: |
          if test -f .github/scripts/friday-pr-lifecycle.cjs; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'Friday synchronizer not landed on default branch yet.'
          fi
      - name: Reconcile exact-head handoffs and Friday labels
        if: steps.installed.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          EXPECTED_ISSUE_KEY: ${{ needs.resolve_parent.outputs.key }}
          POINTER_PR_NUMBER: ${{ needs.resolve_parent.outputs.pr_number }}
          ORIGINAL_EVENT: ${{ needs.resolve_parent.outputs.origin_event }}
        with:
          script: |
            await require('./.github/scripts/friday-pr-lifecycle.cjs').run({
              github,context,core,
              expectedKey:process.env.EXPECTED_ISSUE_KEY,
              prNumber:Number(process.env.POINTER_PR_NUMBER),
              originEvent:process.env.ORIGINAL_EVENT
            });
