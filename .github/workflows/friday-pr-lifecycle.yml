# Friday GitHub-native lifecycle. Never checks out or executes PR-supplied code.
name: Friday PR lifecycle
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Reconcile an existing PR number (e.g. missed review handoff)'
        required: true
        type: number
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  lifecycle:
    # Issue comments and manual runs are validated inside the script; no PR code execution.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: friday-lifecycle-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Check out the reviewed default-branch automation code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # On the feature PR that introduces this script, the default branch does
      # not have it yet. Never fall back to running unreviewed PR-head code.
      - name: Check installed default-branch script
        id: installed
        shell: bash
        run: |
          if test -f .github/scripts/friday-pr-lifecycle.cjs; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'Friday review synchronizer not landed on default branch yet.'
          fi
      - name: Reconcile exact-head handoffs and Friday labels
        if: steps.installed.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/friday-pr-lifecycle.cjs').run({github, context, core});
