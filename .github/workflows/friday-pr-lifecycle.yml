# The PRIVILEGED label writer is a workflow_run controlled by default branch.
# Never execute PR branch code. All artifact contents are untrusted input.
name: Friday PR lifecycle
on:
  workflow_run:
    workflows: [Friday PR lifecycle signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Reconcile an existing PR number (e.g. missed review handoff)'
        required: true
        type: number
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
jobs:
  resolve_parent:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Friday PR lifecycle signal')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      key: ${{ steps.resolve.outputs.key }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      origin_event: ${{ steps.resolve.outputs.origin_event }}
    steps:
      - name: Check out trusted default-branch routing code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Read bounded untrusted ZIP without extracting files
        id: pointer
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const run_id=context.payload.workflow_run.id;
            const items=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id,per_page:100});
            const matches=items.filter(x=>x.name==='friday-event-pointer'&&!x.expired);
            if(matches.length!==1||matches[0].size_in_bytes<52||matches[0].size_in_bytes>4096)
              throw Error('Expected exactly one bounded review-event pointer ZIP');
            // Download only a bounded compressed archive; NEVER run download-artifact,
            // unzip or extract anything into the privileged runner's workspace.
            const result=await github.rest.actions.downloadArtifact({owner,repo,artifact_id:matches[0].id,archive_format:'zip'});
            const data=result.data;
            const buffer=Buffer.isBuffer(data)?data:data instanceof ArrayBuffer?Buffer.from(data):
              ArrayBuffer.isView(data)?Buffer.from(data.buffer,data.byteOffset,data.byteLength):null;
            if(!buffer||buffer.length!==matches[0].size_in_bytes||buffer.length>4096)
              throw Error('Artifact download size mismatch or unsupported binary API response');
            const pointer=require('./.github/scripts/friday-event-zip.cjs').readPointerArchive(buffer);
            core.setOutput('pointer',JSON.stringify(pointer));
      - name: Resolve stable parent issue for serialized label writes
        id: resolve
        uses: actions/github-script@v7
        env:
          DIRECT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_POINTER_JSON: ${{ steps.pointer.outputs.pointer }}
        with:
          script: |
            const {owner,repo}=context.repo;
            let pointer;
            if(context.eventName==='workflow_dispatch'){
              pointer={pr_number:Number(process.env.DIRECT_PR_NUMBER),event_name:'workflow_dispatch'};
            }else{
              const raw=process.env.EVENT_POINTER_JSON||'';
              if(Buffer.byteLength(raw,'utf8')>1024||!raw)throw Error('Invalid bounded event pointer');
              pointer=JSON.parse(raw);
            }
            const kinds=['pull_request','issue_comment','pull_request_review','workflow_dispatch'];
            if(!pointer||!Number.isSafeInteger(pointer.pr_number)||
              pointer.pr_number<1||pointer.pr_number>999999999||
              !kinds.includes(pointer.event_name)){
              core.info('Invalid event pointer; skip');return;
            }
            const n=pointer.pr_number;
            const origin=context.payload.workflow_run;
            if(context.eventName==='workflow_run'&&pointer.event_name!==origin?.event){
              core.warning('Artifact event does not match originating workflow run');return;
            }
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:n})).data;
            if(pr.head?.repo?.full_name!==`${owner}/${repo}`){core.info('Fork or inaccessible PR');return;}
            const script='./.github/scripts/friday-pr-lifecycle.cjs';
            const helper=require('fs').existsSync(script)?require(script):null;
            if(context.eventName==='workflow_run'&&pointer.event_name==='pull_request'){
              // The PR pointer must belong to THIS recorded workflow run,
              // not a number a branch-supplied artifact chose arbitrarily.
              if(!origin.pull_requests?.some(x=>x.number===n)){
                core.warning('Artifact PR number is not in triggering run');return;
              }
            }
            if(context.eventName==='workflow_run'&&
              ['issue_comment','pull_request_review'].includes(pointer.event_name)){
              const id=pointer.event_name==='issue_comment'?pointer.comment_id:pointer.review_id;
              if(!Number.isSafeInteger(id)||id<1){core.info('Missing source comment/review ID');return;}
              let record;
              if(pointer.event_name==='issue_comment'){
                record=(await github.rest.issues.getComment({owner,repo,comment_id:id})).data;
                if(!record.issue_url?.endsWith(`/issues/${n}`)||
                  !helper?.parseReviewSignal(record.body)||
                  helper.parseReviewSignal(record.body).sha!==pr.head.sha.toLowerCase()){
                  core.info('Unrelated or stale review handoff comment');return;
                }
              }else{
                record=(await github.rest.pulls.getReview({owner,repo,pull_number:n,review_id:id})).data;
                const signal=helper?.parseReviewSignal(record.body);
                if(record.commit_id?.toLowerCase()!==pr.head.sha.toLowerCase()||
                  (record.state==='COMMENTED'&&
                    (!signal||signal.sha!==pr.head.sha.toLowerCase()||signal.kind==='request'))||
                  !['APPROVED','CHANGES_REQUESTED','COMMENTED','DISMISSED'].includes(record.state)){
                  core.info('Unrelated or stale PR review');return;
                }
              }
              if(!['OWNER','MEMBER','COLLABORATOR'].includes(record.author_association)){
                core.info('Review actor association not trusted');return;
              }
              const login=record.user?.login;
              if(!login){core.info('Review actor missing');return;}
              const perm=(await github.rest.repos.getCollaboratorPermissionLevel({owner,repo,username:login})).data.permission;
              if(!['admin','maintain','write'].includes(perm)){
                core.info('Review actor lacks repository write authority');return;
              }
            }
            const issue=helper?.getIssueReference(pr)||null;
            core.setOutput('key',issue?`issue-${issue}`:`pr-${n}`);
            core.setOutput('pr_number',String(n));
            core.setOutput('origin_event',pointer.event_name);
  lifecycle:
    needs: resolve_parent
    if: needs.resolve_parent.outputs.key != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      # Multiple PRs to the same issue cannot race on shared labels or closure.
      group: friday-lifecycle-${{ github.repository }}-${{ needs.resolve_parent.outputs.key }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out reviewed default-branch automation code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check installed default-branch script
        id: installed
        shell: bash
        run: |
          if test -f .github/scripts/friday-pr-lifecycle.cjs; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'Friday synchronizer not landed on default branch yet.'
          fi
      - name: Reconcile exact-head handoffs and Friday labels
        if: steps.installed.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          EXPECTED_ISSUE_KEY: ${{ needs.resolve_parent.outputs.key }}
          POINTER_PR_NUMBER: ${{ needs.resolve_parent.outputs.pr_number }}
          ORIGINAL_EVENT: ${{ needs.resolve_parent.outputs.origin_event }}
        with:
          script: |
            await require('./.github/scripts/friday-pr-lifecycle.cjs').run({
              github,context,core,
              expectedKey:process.env.EXPECTED_ISSUE_KEY,
              prNumber:Number(process.env.POINTER_PR_NUMBER),
              originEvent:process.env.ORIGINAL_EVENT
            });
